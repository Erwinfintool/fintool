<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rechner &amp; Simulatoren | Fintool</title>
<link rel="icon" href="assets/fintool-logo.png">
<link rel="stylesheet" href="assets/fintool.css">
<style>
  .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .tool-card { display: flex; flex-direction: column; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-sm); text-decoration: none; color: inherit; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  .tool-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .tool-card-top { background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid)); padding: 18px 18px 14px; display: flex; align-items: center; gap: 12px; }
  .tool-card-top img { height: 18px; width: auto; filter: brightness(0) invert(1); opacity: .9; }
  .tool-card-top span { color: rgba(255,255,255,0.8); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .tool-card-bar { height: 4px; background: var(--red); }
  .tool-card-body { padding: 14px 18px 18px; flex: 1; display: flex; flex-direction: column; }
  .tool-card-title { font-size: 16px; font-weight: 700; color: var(--grey-800); margin-bottom: 6px; }
  .tool-card-sub { font-size: 13px; color: var(--grey-500); line-height: 1.5; flex: 1; }
  .tool-card-link { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--blue-dark); }
  .overview-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 32px 8px 20px; }
  .overview-hero img { height: 44px; width: auto; margin-bottom: 18px; }
  .page { max-width: 900px; }
</style>
</head>
<body>

<div class="page">
  <div class="overview-hero">
    <img src="assets/fintool-logo.png" alt="Fintool">
    <p class="splash-eyebrow" id="ov_eyebrow"></p>
    <h1 class="splash-title" id="ov_title"></h1>
    <p class="splash-author" id="ov_author"></p>
    <p class="splash-sub" id="ov_sub"></p>
  </div>

  <!-- Die Kacheln werden aus tools.js erzeugt – dort bearbeiten, nicht hier. -->
  <div class="tools-grid" id="tools_grid"></div>

  <div class="app-footer" style="margin-top:24px;">
    <img class="ft-footer-logo" src="assets/fintool-logo.png" alt="Fintool">
    <span id="ov_footer"></span><br>
    <strong>fintool.ch</strong> &nbsp;·&nbsp; <a href="https://fintool.ch">Prof. Dr. Erwin W. Heri</a>
  </div>
</div>

<script src="tools.js"></script>
<script>
(function(){
  var u = FINTOOL_UEBERSICHT;
  document.getElementById('ov_eyebrow').innerHTML = u.eyebrow.replace(' · ', ' <span>·</span> ');
  document.getElementById('ov_title').innerHTML = u.titel;
  document.getElementById('ov_author').textContent = u.autor;
  document.getElementById('ov_sub').textContent = u.untertitel;
  document.getElementById('ov_footer').textContent = u.fusszeile;
  var grid = document.getElementById('tools_grid');
  FINTOOL_TOOLS.forEach(function(t){
    var a = document.createElement('a');
    a.className = 'tool-card'; a.href = t.datei;
    a.innerHTML =
      '<div class="tool-card-top"><img src="assets/fintool-logo.png" alt=""><span></span></div><div class="tool-card-bar"></div>' +
      '<div class="tool-card-body"><div class="tool-card-title"></div><div class="tool-card-sub"></div><div class="tool-card-link">Öffnen →</div></div>';
    a.querySelector('.tool-card-top span').textContent = t.kategorie;
    a.querySelector('.tool-card-title').textContent = t.titel;
    a.querySelector('.tool-card-sub').textContent = t.beschreibung;
    grid.appendChild(a);
  });
})();
</script>

</body>
</html>
